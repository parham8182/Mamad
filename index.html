<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هوش فیک علی | دستیار هوشمند</title>
<meta name="description" content="هوش فیک علی؛ یک دستیار هوشمند ساده فارسی برای پرسش و پاسخ و محاسبات ریاضی.">
<meta name="keywords" content="هوش فیک علی, هوش مصنوعی, دستیار هوشمند, هوش فیک, علی">
<meta name="robots" content="index, follow">
<meta property="og:title" content="هوش فیک علی | دستیار هوشمند">
<meta property="og:description" content="هوش فیک علی؛ دستیار هوشمند ساده فارسی.">
<meta property="og:type" content="website">
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:Tahoma,Arial,sans-serif; background:linear-gradient(135deg,#1e293b,#0f172a); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .app { width:100%; max-width:480px; background:#111827; border-radius:18px; box-shadow:0 20px 50px rgba(0,0,0,.5); overflow:hidden; display:flex; flex-direction:column; height:640px; }
  header { background:linear-gradient(90deg,#6366f1,#8b5cf6); padding:16px 20px; color:white; }
  header h1 { margin:0; font-size:18px; } header p { margin:4px 0 0; font-size:12px; opacity:.85; }
  .chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:80%; padding:10px 14px; border-radius:14px; font-size:14px; line-height:1.6; white-space:pre-wrap; }
  .bot { background:#1f2937; color:#e5e7eb; align-self:flex-start; border-bottom-left-radius:4px; }
  .user { background:#6366f1; color:white; align-self:flex-end; border-bottom-right-radius:4px; }
  .input-area { display:flex; gap:8px; padding:14px; background:#0f172a; border-top:1px solid #1f2937; }
  input { flex:1; padding:12px 14px; border-radius:10px; border:none; background:#1f2937; color:white; font-size:14px; outline:none; }
  button { padding:0 18px; border-radius:10px; border:none; background:#6366f1; color:white; font-weight:bold; cursor:pointer; }
  button:active { transform:scale(.97); }
</style>
</head>
<body>
<div class="app">
<header><h1>🤖 هوش فیک علی</h1><p>یک سوال بپرس، جواب می‌دهم</p></header>
<div class="chat" id="chat"><div class="msg bot">سلام! من هوش فیک علی هستم. هر سوالی داری بپرس.</div></div>
<div class="input-area"><input id="input" type="text" placeholder="سوالت رو بنویس..." /><button onclick="send()">ارسال</button></div>
</div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input');
const knowledge=[
{keys:['سلام','درود','های'],answer:'سلام! خوش اومدی. چطور می‌تونم کمکت کنم؟'},
{keys:['اسمت','نامت','کی هستی'],answer:'من هوش فیک علی هستم؛ یک دستیار پرسش و پاسخ ساده که با HTML و جاوااسکریپت ساخته شده.'},
{keys:['ساعت','زمان'],answer:()=> 'الان ساعت '+new Date().toLocaleTimeString('fa-IR')+' است.'},
{keys:['تاریخ','امروز چندشنبه'],answer:()=> 'امروز '+new Date().toLocaleDateString('fa-IR')+' است.'},
{keys:['حالت چطوره','چطوری'],answer:'من که یک برنامه‌ام، همیشه آماده کمکم! تو چطوری؟'},
{keys:['ممنون','مرسی','تشکر'],answer:'خواهش می‌کنم! خوشحال شدم کمک کردم 🙂'},
{keys:['خداحافظ','بای'],answer:'خداحافظ! هر وقت خواستی دوباره بپرس.'},
{keys:['جمع','به علاوه','+'],answer:'برای محاسبات ریاضی ساده، عبارت رو مثل "5+3" بنویس تا حساب کنم.'}];
function tryMath(text){const cleaned=text.replace(/\s/g,'');if(/^-?\d+(\.\d+)?[\+\-\*\/]\-?\d+(\.\d+)?$/.test(cleaned)){try{return 'نتیجه: '+Function('"use strict";return ('+cleaned+')')();}catch(e){return null;}}return null;}
function findAnswer(text){const m=tryMath(text);if(m)return m;const lower=text.toLowerCase();for(const item of knowledge){if(item.keys.some(k=>lower.includes(k)))return typeof item.answer==='function'?item.answer():item.answer;}return 'متاسفانه پاسخ این سوال رو در پایگاه دانش ساده‌ام ندارم. این یک ربات پایه مبتنی بر کلیدواژه است، نه هوش مصنوعی واقعی متصل به اینترنت.';}
function addMessage(text,sender){const div=document.createElement('div');div.className='msg '+sender;div.textContent=text;chat.appendChild(div);chat.scrollTop=chat.scrollHeight;}
function send(){const text=input.value.trim();if(!text)return;addMessage(text,'user');input.value='';setTimeout(()=>addMessage(findAnswer(text),'bot'),400);}
input.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
</script>
</body>
</html>
